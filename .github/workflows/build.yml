name: 'Build server'

on:
  push:
    branches:
      - dev
    tags:
      - '*'
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-server

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: "Set image tag"
        id: tag
        run: |
          IMAGE_TAG="0.0.0"
          if [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
              REF=${{ github.ref }};
              TAG_FULL=${REF#refs/*/};
              IMAGE_TAG=${TAG_FULL//\//_};
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v3

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 'Build frontend'
        working-directory: server/frontend
        run: |
          docker buildx build -t ${IMAGE_NAME}-frontend:${IMAGE_TAG} --load .

      - name: 'Build backend'
        working-directory: server/backend
        run: |
          make docker BUILD_VERSION=${IMAGE_TAG}

      - name: 'Push frontend'
        run: |
          docker push ${IMAGE_NAME}-frontend:${IMAGE_TAG}

      - name: 'Push backend'
        run: |
          docker push ${IMAGE_NAME}-backend:${IMAGE_TAG}
